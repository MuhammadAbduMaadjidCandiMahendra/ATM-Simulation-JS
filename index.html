<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="index.css" />
  <title>ATM-Simulation</title>
</head>
<body>
  <aside>
    <h1 id="title" class="brand">🏧 Simulation</h1>
    <hr>
    <ul class="sidebar-nav">
      <li><a id="to-dashboard" href="/dashboard">Dashboard</a></li>
      <li><a id="to-deposit" href="/deposit">Deposit Cash</a></li>
      <li><a id="to-withdraw" href="/withdraw">Withdraw</a></li>
    </ul>
    <hr>
    <footer>White belt</footer>
  </aside>

  <main>
    <header>
      <h1 id="content-title" class="page-title">Dashboard</h1>
      <hr>
    </header>

    <section id="main-section">
      <div id="dashboard-content">
        <div class="form-group">
          <div class="input-group">
            <label for="accountName">Name</label>
            <input type="text" name="accountName" id="accountName" placeholder="" value="John Doe" />
          </div>

          <div class="input-group">
            <label for="accountNumber">Account Number</label>
            <input type="number" name="accountNumber" id="accountNumber" placeholder="" value="123456" />
          </div>

          <div class="input-group">
            <label for="balance">Balance</label>
            <input type="number" name="balance" id="balance" placeholder="" value="100000" />
          </div>

        </div>
      </div>

      <div id="deposit-content" style="display: none;">
        <form action="/deposit" method="post" class="form-group">

          <div class="input-group">
            <label for="deposit-amount">Deposit amount</label>
            <input type="number" name="deposit-amount" id="deposit-amount" placeholder="Enter deposit amount" />
          </div>

          <button class="btn" type="submit">Deposit</button>
        </form>
      </div>

      <div id="withdraw-content" style="display: none;">
        <form action="/withdraw" method="post" class="form-group">

          <div class="input-group">
            <label for="withdraw-amount">Withdraw amount</label>
            <input type="number" name="withdraw-amount" id="withdraw-amount" placeholder="Enter withdraw amount" />
          </div>
          
          <button class="btn" type="submit">Withdraw</button>
        </form>
      </div>

    </section>
  </main>

  <script src="main.js" type="module"></script>
</body>
</html>
