<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="index.css" />
  <title>ATM-Simulation</title>
</head>
<body>
  <aside>
    <section>
      <h1 id="title">ATM Simulation</h1>
      <ul>
        <li><a id="to-dashboard" href="/dashboard">Dashboard</a></li>
        <li><a id="to-deposit" href="/deposit">Deposit Cash</a></li>
        <li><a id="to-withdraw" href="/withdraw">Withdraw</a></li>
      </ul>
    </section>

    <section>
      <footer>White belt</footer>
    </section>
  </aside>

  <main>
    <header>
      <h1 id="content-title">Dashboard</h1>
    </header>

    <section id="main-section">
      <div id="dashboard-content">
        <h2>Name: <span id="name">John Doe</span></h2>
        <h2>Account: <span id="account">123456</span></h2>
        <h2>Balance: <span id="balance">99.000.000</span></h2>
      </div>

      <div id="deposit-content" style="display: none;">
        <form action="/deposit" method="post">
          <label for="deposit-amount">Deposit amount</label>
          <input type="number" name="deposit-amount" id="deposit-amount" placeholder="Enter deposit amount" />
          <button type="submit">Deposit</button>
        </form>
      </div>

      <div id="withdraw-content" style="display: none;">
        <form action="/withdraw" method="post">
          <label for="withdraw-amount">Withdraw amount</label>
          <input type="number" name="withdraw-amount" id="withdraw-amount" placeholder="Enter withdraw amount" />
          <button type="submit">Withdraw</button>
        </form>
      </div>

    </section>
  </main>

  <script src="main.js" type="module"></script>
</body>
</html>
