<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="index.css" />
  <title>ATM-Simulation</title>
</head>
<body>
  <aside>
    <h1 id="title" class="brand">🏧 Simulation</h1>
    <hr>
    <ul class="sidebar-nav">
      <li><a id="to-dashboard" href="/dashboard">Dashboard</a></li>
      <li><a id="to-withdraw" href="/withdraw">Withdraw</a></li>
      <li style="display: none"><a id="to-deposit" href="/deposit">Deposit Cash</a></li>
    </ul>
    <hr>
    <footer>White belt</footer>
  </aside>

  <main>
    <header>
      <h1 id="content-title" class="page-title">Dashboard</h1>
      <hr>
    </header>

    <section id="main-section">
      <div id="dashboard-content">
        <div class="form-group">
          <form action="/action" method="get" id="getAccountInfoForm">
            <div class="input-group">
              <label for="accountNumber">Account Number</label>
              <div class="input-container">
                <input type="number" name="accountNumber" id="accountNumber" placeholder="Type account number here..." />
                <span class="text-error"></span>
              </div>
            </div>
            <button class="btn" type="submit">Find account info</button>
            <hr>
            <div class="input-group">
              <label for="accountName">Name</label>
              <input type="text" name="accountName" id="accountName" readonly/>
            </div>
            <div class="input-group">
              <label for="balance">Balance</label>
              <input type="number" name="balance" id="balance" readonly/>
            </div>
          </form>
        </div>
      </div>

      <div id="deposit-content" style="display: none;">
        <form action="/deposit" method="post" class="form-group">

          <div class="input-group">
            <label for="deposit-amount">Deposit amount</label>
            <input type="number" name="deposit-amount" id="deposit-amount" placeholder="Enter deposit amount" />
          </div>

          <button class="btn" type="submit">Deposit</button>
        </form>
      </div>

      <div id="withdraw-content" style="display: none;">
        <form id="withdrawForm" action="/withdraw" method="post" class="form-group">

          <div class="input-group">
            <label for="wf-accountNumber">Account Number</label>
            <div class="input-container">
              <input type="number" name="accountNumber" id="wf-accountNumber" readonly />
              <span class="text-error"></span>
            </div>
          </div>

          <div class="input-group">
            <label for="wf-balance">Balance</label>
            <input type="number" name="balance" id="wf-balance" readonly/>
          </div>

          <div class="input-group">
            <label for="withdrawAmount">Withdraw amount</label>
            <div class="input-container">
              <input type="number" name="withdrawAmount" id="withdrawAmount" placeholder="Enter withdraw amount"/>
              <span class="text-error"></span>
            </div>
          </div>

          <div class="input-group">
            <div></div>
            <span id="withdrawSuccess" hidden>test</span>
          </div>
          <button class="btn" type="submit">Withdraw</button>
        </form>
      </div>

    </section>
  </main>

  <script src="main.js" type="module"></script>
</body>
</html>
